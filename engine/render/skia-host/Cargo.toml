[package]
name = "tenun-skia-host"
version = "0.1.0"
edition = "2021"
description = "Framework-owned Skia rasterizer for display-list scenes v1 (ADR-0026 stage 2): paints the exact scene wire contract through skia-safe."

[lib]
# rlib for tests/evidence; cdylib for the future Android JNI surface.
crate-type = ["rlib", "cdylib"]

[dependencies]
skia-safe = "0.87"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
