name: ci

on:
  push:
    branches: [main]
  pull_request:
  # pushes from some credential types do not raise push/pull_request events;
  # dispatch keeps CI runnable for those sessions
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # canonical TS verification: lockfile guard + frozen install + tsc + bun test
      - run: bun run verify:ts

  verify-rust:
    runs-on: ubuntu-latest
    env:
      BINDGEN_EXTRA_CLANG_ARGS: ${{ format('-I{0}', '/usr/lib/gcc/x86_64-linux-gnu/13/include') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Resolve gcc include dir for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - name: fmt + clippy + test
        run: ./.github/scripts/verify-rust.sh

  verify-abi:
    runs-on: ubuntu-latest
    needs: [verify-rust]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Resolve gcc include dir for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: ./.github/scripts/verify-abi.sh

  # replays every evidence packet's reproducibility chain from a clean
  # checkout (H3): rebuilds cdylibs, reruns drivers, requires ALL PASS.
  # Policy (review-5): packet identity = unchanged inputs_digest (the
  # evidence directory itself is excluded from the digest) + recorded commit
  # must be an ancestor of HEAD. Exact-HEAD is unachievable for
  # self-referential evidence commits (regenerating at HEAD would change the
  # tree, moving HEAD); inputs_digest is the chosen canonical identity.
  # Strict artifact manifest comparison is ALWAYS ON for the production run;
  # TENUN_EVIDENCE_DIR overrides packets only in mutation-test child
  # processes.
  verify-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run headless native-integration probe
        run: ./benchmarks/architecture/run-native-probe.sh

  verify-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Run Android embedder execution loop test
        run: ./embedders/android/run_android_test.sh

  # TN-132: installed-device acceptance. Runs the packaged APK on a
  # KVM-backed hosted emulator (ubuntu-24.04 VM runner — ubuntu-slim and
  # containers have no nested KVM). Environment failures exit 90 as
  # DEVICE-ENVIRONMENT-FAILURE; application/test failures exit 1 as
  # DEVICE-ACCEPTANCE-FAILURE. CheckJNI stays enabled for the whole run.
  verify-android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable KVM group perms (GitHub-documented setup)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install emulator runtime libraries (runner image omits libpulse)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - name: Run installed-device acceptance on a KVM-backed emulator
        run: ./embedders/android/run_device_acceptance.sh
      - name: Upload device acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-acceptance
          path: embedders/android/device-acceptance-output/
          if-no-files-found: warn

  verify-evidence:
    runs-on: ubuntu-latest
    env:
      # BINDGEN_EXTRA_CLANG_ARGS intentionally NOT set here: gcc's math.h
      # NAN resolves double-typed and breaks yoga's generated const; bindgen
      # bundled headers (no extra args) match the generator environment
      TENUN_EVIDENCE_REPLAY: "1"
      TENUN_EVIDENCE_STRICT_ARTIFACTS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so ancestry checks are decidable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # exact toolchain + libclang pin: evidence artifacts must be
      # bit-identical between local generation and CI verification
      # (review-5 strict artifacts)
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Pin libclang to 18 (bindings must match local generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-18-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
      - name: Validator mutation selftest
        run: python3 ./.github/scripts/verify-evidence.py --selftest
      - name: Production integration mutation test
        run: python3 ./.github/scripts/verify-evidence.py --integration-mutation-test
      - name: Verify evidence packets
        run: python3 ./.github/scripts/verify-evidence.py
