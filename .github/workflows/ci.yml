name: ci

on:
  push:
    branches: [main]
  pull_request:
  # pushes from some credential types do not raise push/pull_request events;
  # dispatch keeps CI runnable for those sessions
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # --frozen-lockfile activates automatically once bun.lock exists (first dep added)
      - run: bun install --frozen-lockfile
      - run: bun test

  verify-rust:
    runs-on: ubuntu-latest
    env:
      BINDGEN_EXTRA_CLANG_ARGS: ${{ format('-I{0}', '/usr/lib/gcc/x86_64-linux-gnu/13/include') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Resolve gcc include dir for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - name: fmt + clippy + test
        run: ./.github/scripts/verify-rust.sh

  verify-abi:
    runs-on: ubuntu-latest
    needs: [verify-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Resolve gcc include dir for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: ./.github/scripts/verify-abi.sh

  # replays every evidence packet's reproducibility chain from a clean
  # checkout (H3): rebuilds cdylibs, reruns drivers, requires ALL PASS.
  # Policy (review-5): packet identity = unchanged inputs_digest (the
  # evidence directory itself is excluded from the digest) + recorded commit
  # must be an ancestor of HEAD. Exact-HEAD is unachievable for
  # self-referential evidence commits (regenerating at HEAD would change the
  # tree, moving HEAD); inputs_digest is the chosen canonical identity.
  # Strict artifact manifest comparison is ALWAYS ON for the production run;
  # TENUN_EVIDENCE_DIR overrides packets only in mutation-test child
  # processes.
  verify-evidence:
    runs-on: ubuntu-latest
    env:
      BINDGEN_EXTRA_CLANG_ARGS: ${{ format('-I{0}', '/usr/lib/gcc/x86_64-linux-gnu/13/include') }}
      TENUN_EVIDENCE_REPLAY: "1"
      TENUN_EVIDENCE_STRICT_ARTIFACTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so ancestry checks are decidable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # exact toolchain pin: evidence packets record compiler version and
      # artifacts must be bit-identical to local generation (review-5).
      # bindgen env intentionally left unset: the generator's environment
      # uses bindgen's bundled headers, and clang's own NAN resolves to
      # f32::NAN (gcc's math.h NAN resolves double-typed and breaks the
      # yoga crate's generated const under this toolchain)
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - name: Validator mutation selftest
        run: python3 ./.github/scripts/verify-evidence.py --selftest
      - name: Production integration mutation test
        run: python3 ./.github/scripts/verify-evidence.py --integration-mutation-test
      - name: Verify evidence packets
        run: python3 ./.github/scripts/verify-evidence.py
