<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TenunJS Gallery Preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #08090d; color: #f2f2f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #1c2436, #08090d 60%); }
      .workspace { width: min(100vw, 1160px); padding: 28px; display: grid; grid-template-columns: 260px minmax(320px, 720px); gap: 28px; align-items: start; }
      .rail { display: grid; gap: 12px; }
      .eyebrow { color: #8aaeff; text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 700; }
      h1 { margin: 0; font-size: 28px; }
      .subtle { color: #aeb5c4; line-height: 1.5; font-size: 14px; }
      .routes { display: grid; gap: 8px; margin-top: 12px; }
      .route { border: 1px solid #303747; background: #151923; color: #e9edf7; padding: 11px 13px; border-radius: 12px; text-align: left; cursor: pointer; }
      .route:hover, .route.active { border-color: #4c8dff; background: #1d2d4c; }
      .status { color: #7ff0bd; font-size: 12px; }
      .frame { min-width: 0; border: 1px solid #31394a; border-radius: 30px; padding: 14px; background: #0d1018; box-shadow: 0 28px 80px #0009; }
      .framebar { display: flex; justify-content: space-between; padding: 2px 8px 12px; color: #9ca8bd; font-size: 12px; }
      canvas { display: block; width: 100%; height: min(78vh, 820px); border-radius: 18px; background: #101014; touch-action: none; }
      @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; padding: 16px; } .rail { order: 2; } .frame { order: 1; } canvas { height: 70vh; } }
    </style>
  </head>
  <body>
    <main class="workspace">
      <aside class="rail">
        <div class="eyebrow">TenunJS / UI lab</div>
        <h1>Gallery Preview</h1>
        <p class="subtle">The real gallery screen state and actions, rendered locally before packaging an APK.</p>
        <div class="status" id="status">Canvas preview ready</div>
        <nav class="routes" id="routes" aria-label="Gallery screens"></nav>
        <p class="subtle">Drag to scroll. Click buttons to dispatch real actions. Press <kbd>H</kbd> to return home.</p>
      </aside>
      <section class="frame">
        <div class="framebar"><span id="route-label">home</span><span id="reload-label">live</span></div>
        <canvas id="preview" aria-label="TenunJS gallery preview"></canvas>
      </section>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
