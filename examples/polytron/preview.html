<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#081110" />
    <title>Polytron Wash · TenunJS</title>
    <style>
      /* Mobile-first: the app is a full-bleed single column — sticky
         header with brand + link status, tab row (Home Assistant tab
         style with underline), canvas fills the rest of the viewport.
         Wide screens get the same app centered as a phone column. */
      :root {
        color-scheme: dark;
        --bg: #081110; --card: #0a141a; --line: #22303c;
        --txt: #e6eef7; --dim: #86a1bf; --acc: #00b7fd; --ok: #00ff80;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--txt);
        font-family: Inter, system-ui, sans-serif;
      }
      .app {
        height: 100dvh; display: flex; flex-direction: column;
        max-width: 100vw;
      }
      .hdr {
        flex: none; position: sticky; top: 0; z-index: 5;
        background: #0a141ae6; backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding-top: env(safe-area-inset-top);
      }
      .hdr-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 14px 8px;
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: .02em; min-width: 0; }
      .brand .logo { display: block; width: 20px; height: 20px; flex: none; }
      .brand .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .link { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); white-space: nowrap; }
      #demo-btn {
        border: 1px solid var(--line); background: #0e1a20; color: var(--dim);
        font: 700 11px/1 Inter, system-ui, sans-serif; letter-spacing: .08em;
        padding: 6px 10px; border-radius: 999px; cursor: pointer; flex: none;
      }
      #demo-btn.on { border-color: var(--acc); color: var(--acc); background: #08222e; }
      /* Link state lives HERE once — not as a banner atop every tab. The
         chain icon breaks when unlinked; tap to connect / disconnect. */
      #link-btn {
        display: flex; align-items: center; gap: 6px;
        border: 1px solid var(--line); background: #0e1a20; color: var(--dim);
        font: 700 11px/1 Inter, system-ui, sans-serif; letter-spacing: .04em;
        padding: 6px 10px; border-radius: 999px; cursor: pointer; flex: none;
      }
      #link-btn svg { width: 13px; height: 13px; flex: none; }
      #link-btn .icon-full { display: none; }
      #link-btn.ok { border-color: #00ff8055; color: var(--ok); }
      #link-btn.ok .icon-full { display: block; }
      #link-btn.ok .icon-broken { display: none; }
      #link-btn.wait { border-color: #fcb51866; color: #fcb518; }
      #link-btn:disabled { cursor: default; }
      /* Narrow phones: the pill keeps its state color + icon (the title
         tooltip still carries the full text) so the brand row fits on
         one 320px line. */
      @media (max-width: 359px) {
        #link-btn span { display: none; }
        #demo-btn { padding: 6px 8px; }
      }
      #routes { display: flex; }
      #routes button {
        flex: 1 1 0; min-width: 0; border: 0; background: none; color: var(--dim);
        padding: 9px 4px; font: 600 12.5px/1.2 Inter, system-ui, sans-serif;
        border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
      }
      #routes button.active { color: var(--acc); border-bottom-color: var(--acc); }
      .stage { flex: 1 1 auto; min-height: 0; position: relative; }
      canvas {
        display: block; width: 100%; height: 100%;
        touch-action: none; background: var(--bg);
      }
      @media (min-width: 760px) {
        body { display: grid; place-items: center; background: radial-gradient(circle at 15% 0%, #0c2a3a, #081110 60%); }
        .app {
          width: 480px; max-width: 100vw; height: min(94dvh, 940px); border-radius: 26px;
          border: 1px solid var(--line); overflow: hidden;
          box-shadow: 0 24px 70px #0009;
        }
        .hdr { position: static; }
      }
      @media (min-width: 1100px) {
        .app { width: 560px; }
      }
      #prog-edit { position: fixed; inset: 0; background: #081110f2; display: grid; place-items: center; z-index: 10; padding: 12px; }
      #prog-edit[hidden] { display: none; }
      .pair-card { width: min(94vw, 440px); max-height: min(92dvh, 640px); overflow-y: auto; border: 1px solid var(--line); border-radius: 20px; background: #0a141a; padding: 18px; display: grid; gap: 12px; }
      .pair-card h2 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
      .pair-card h2 span { font-size: 13px; color: var(--dim); font-weight: normal; }
      .step-builder { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 2px; }
      .step-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #0e1a20; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
      .step-mode { font: 800 11.5px Inter, system-ui; padding: 4px 8px; border-radius: 6px; letter-spacing: .04em; }
      .step-stepper { display: flex; align-items: center; gap: 6px; }
      .step-stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #13242e; color: var(--txt); font-weight: 800; cursor: pointer; }
      .step-val { font: 700 12.5px ui-monospace, monospace; min-width: 58px; text-align: center; color: var(--acc); }
      .step-del { border: none; background: transparent; color: #ff5566; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
      .quick-adds { display: flex; flex-wrap: wrap; gap: 6px; }
      .quick-btn { font: 600 11px Inter, system-ui; padding: 5px 9px; border-radius: 8px; border: 1px dashed var(--line); background: #0c181f; color: var(--dim); cursor: pointer; }
      .quick-btn:hover { border-color: var(--acc); color: var(--txt); }
      #prog-edit-summary { font: 600 11.5px Inter, system-ui; color: var(--dim); line-height: 1.4; padding: 6px 10px; background: #0c181f; border-radius: 8px; border-left: 3px solid var(--acc); }
      .raw-toggle { font: 600 11px Inter, system-ui; color: var(--dim); background: none; border: none; cursor: pointer; text-align: left; padding: 2px 0; text-decoration: underline; }
      #prog-edit-raw-section { display: grid; gap: 8px; }
      #prog-edit-raw-section[hidden] { display: none; }
      #prog-edit-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0e1a20; color: var(--txt); font: 600 13px ui-monospace, monospace; letter-spacing: .04em; }
      #prog-edit-msg { color: var(--dim); font-size: 11.5px; line-height: 1.5; min-height: 18px; }
      .pair-actions { display: flex; gap: 8px; }
      .pair-actions button { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: #0e1a20; color: var(--txt); font-weight: 700; cursor: pointer; }
      #prog-edit-save { border-color: var(--acc); color: var(--acc); background: #08222e; }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="hdr">
        <div class="hdr-row">
          <div class="brand">
            <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="6" stroke="#00B7FD" stroke-width="2.4"/>
              <path d="M6 13.5c1.2-1.6 2.4-1.6 3.6 0s2.4 1.6 3.6 0 2.4-1.6 3.6 0" stroke="#00B7FD" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M7.5 8.2c.6-.8 1.2-.8 1.8 0" stroke="#00B7FD" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M13.4 8.2c.6-.8 1.2-.8 1.8 0" stroke="#00B7FD" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="name">Polytron Wash</span>
          </div>
          <div class="link">
            <button id="demo-btn" title="jalankan tanpa mesin" aria-pressed="false">DEMO</button>
            <button id="link-btn" title="status sambungan Bluetooth">
              <svg class="icon-broken" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.5 15.5 15.5 8.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M12.5 6.5 14 5a4 4 0 0 1 5.7 5.7l-1.6 1.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M11.5 17.5 10 19a4 4 0 0 1-5.7-5.7l1.6-1.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <svg class="icon-full" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M10 14a4 4 0 0 1 0-5.6l2.8-2.9a4 4 0 0 1 5.7 5.7l-1.4 1.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M14 10a4 4 0 0 1 0 5.6l-2.8 2.9a4 4 0 0 1-5.7-5.7l1.4-1.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <span id="status" aria-live="polite">offline</span>
            </button>
          </div>
        </div>
        <nav id="routes" aria-label="Tab aplikasi"></nav>
      </header>
      <main class="stage">
        <canvas id="preview" role="img" aria-label="Dasbor mesin cuci Polytron — kontrol digambar di kanvas"></canvas>
      </main>
    </div>
    <div id="prog-edit" hidden>
      <div class="pair-card">
        <h2>
          <span>Edit Program</span>
          <span id="prog-edit-title"></span>
        </h2>
        <div id="prog-edit-steps" class="step-builder"></div>
        <div class="quick-adds">
          <button type="button" class="quick-btn" data-add="WASH:600">+ Cuci</button>
          <button type="button" class="quick-btn" data-add="RINSE:300">+ Bilas</button>
          <button type="button" class="quick-btn" data-add="DRAIN:60">+ Buang</button>
          <button type="button" class="quick-btn" data-add="FILL:60">+ Isi</button>
          <button type="button" class="quick-btn" data-add="SPIN:300">+ Peras</button>
        </div>
        <div id="prog-edit-summary"></div>
        <button type="button" id="prog-edit-toggle-raw" class="raw-toggle">Tampilkan format teks mentah</button>
        <div id="prog-edit-raw-section" hidden>
          <input id="prog-edit-input" placeholder="WASH:600, DRAIN:30, SPIN:300" autocomplete="off" spellcheck="false" />
          <div id="prog-edit-msg"></div>
        </div>
        <div class="pair-actions">
          <button id="prog-edit-save">Simpan</button>
          <button id="prog-edit-cancel">Batal</button>
        </div>
      </div>
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
